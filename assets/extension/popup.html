<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>dsh-browser</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="headline"><span id="dot" class="dot"></span><span id="headline">正在检查...</span></p>
      <p id="detail" class="detail">正在读取状态...</p>
      <p id="binding" class="binding">尚未绑定标签页</p>
      <p id="capabilities" class="binding">浏览器求值: 正在检测...</p>
      <details class="pairing">
        <summary class="pairing-title">配对令牌</summary>
        <p class="pairing-hint">
          把下面这串复制到 dsh 的「设置 -&gt; 插件 -&gt; dsh-browser」的 pairingToken 里.
          dsh 没配置它之前, 浏览器操作会被拒绝.
        </p>
        <code id="pairing-token" class="pairing-token">读取中...</code>
        <div class="pairing-actions">
          <button id="copy-pairing" type="button">复制</button>
          <button id="reset-pairing" type="button">重新生成</button>
        </div>
      </details>
      <p id="pairing-state" class="pairing-state"></p>
      <button id="reconnect" type="button">重新连接</button>
      <p class="hint">
        本扩展不使用 Chrome 调试协议, 它通过 native messaging 与 dsh 通信.
        连不上时请在 dsh 的插件配置页点「安装连接组件」.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
